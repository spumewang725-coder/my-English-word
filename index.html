<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My English Words</title></head><body><div id="loading">正在加载词库…</div><script>
(async()=>{
 const url='https://raw.githubusercontent.com/spumewang725-coder/my-English-word/4bb1ecc525669a0d257c0880f60af0dadfe1e24e/index.html';
 try{
  let html=await (await fetch(url)).text();
  const oldParse=/function parseLine\(s\).*?function scopeWords\(\)/s;
  const fixedParse=`function parseLine(s){s=String(s||'').trim();if(!s)return null;let m=s.match(/^(.+?)\\s*[-–—]\\s*([\\u4e00-\\u9fff][\\u4e00-\\u9fff\\s、，,。；;：:！!?？]*)$/);if(m)return {word:m[1].trim(),zh:m[2].trim()};m=s.match(/^(.*?)\\s+([\\u4e00-\\u9fff][\\u4e00-\\u9fff\\s、，,。；;：:！!?？]*)$/);return m?{word:m[1].trim(),zh:m[2].trim()}:{word:s,zh:''}}function parseBulk(text){let lines=String(text||'').replace(/\\r/g,'').split(/\\n+/).map(x=>x.trim()).filter(Boolean),out=[];lines.forEach(line=>{let re=/([A-Za-z][A-Za-z0-9'&]*(?:\\s+[A-Za-z][A-Za-z0-9'&]*)*)\\s*[-–—]\\s*([\\u4e00-\\u9fff][^\\s]*?)(?=\\s+[A-Za-z][A-Za-z0-9'&]*(?:\\s+[A-Za-z][A-Za-z0-9'&]*)*\\s*[-–—]|$)/g,m,found=false;while((m=re.exec(line))){out.push({word:m[1].trim(),zh:m[2].trim()});found=true}if(!found){let x=parseLine(line);if(x)out.push(x)}});return out}function scopeWords()`;
  html=html.replace(oldParse,fixedParse);
  const oldAdd=/\$\('add'\)\.onclick=function\(\)\{.*?\$\('clear'\)\.onclick=/s;
  const newAdd=`$('add').onclick=function(){let p=$('parentSelect').value,c=$('childSelect').value,seen=new Set(words.map(x=>english(x).toLowerCase()));let parsed=parseBulk($('input').value);let added=0,updated=0,skipped=0;parsed.filter(x=>x.word).forEach(o=>{let k=o.word.toLowerCase();let existing=words.find(w=>english(w).toLowerCase()===k);if(!existing){words.push({word:o.word,parent:p,category:c,_zh:o.zh||''});seen.add(k);added++}else if(o.zh&&!existing._zh){existing._zh=o.zh;updated++}else{skipped++}});$('input').value='';selectedParent=p;selectedChild=c;save();render();alert(\`本次识别 ${'${'}parsed.length} 条：新增 ${'${'}added} 条，补充中文 ${'${'}updated} 条，重复跳过 ${'${'}skipped} 条。\`)};$('clear').onclick=`;
  html=html.replace(oldAdd,newAdd);
  html=html.replace('格式：英文词/词组 + 空格 + 中文释义。英文词组不会被拆开。','格式支持：Potatoes-土豆，也支持 kiwi fruit-猕猴桃；一行可以放多个词条。');
  html=html.replace('<button class="primary" id="psubmit">提交答案</button>','<button class="primary" id="psubmit">提交答案</button><button class="soft" id="preveal" style="display:none">💡 显示答案</button>');
  const oldShow=/function showPractice\(\)\{.*?\}function norm/s;
  const newShow=`function showPractice(){let x=items[idx];answered=false;$('preveal').style.display='none';$('pword').textContent=mode==='spelling'?'🔊 听发音并拼写':english(x);$('pinput').value='';$('pinput').disabled=false;$('pinput').placeholder=mode==='spelling'?'请输入你听到的单词':'请输入这个单词的中文意思';$('presult').textContent='';$('pprogress').textContent=\`第 ${'${'}idx+1} / ${'${'}items.length} 题\`;setTimeout(()=>speak(english(x)),100)}function norm`;
  html=html.replace(oldShow,newShow);
  const oldSubmit=/function submitPractice\(\)\{.*?\}function renderWrong/s;
  const newSubmit=`function submitPractice(){if(answered)return;let a=$('pinput').value.trim(),x=items[idx];if(!a)return;if(mode==='spelling'){if(a.toLowerCase()===english(x).toLowerCase()){$('presult').textContent='🎉 正确！';answered=true;$('pinput').disabled=true;$('preveal').style.display='none'}else{$('presult').textContent='❌ 不对，再试一次！';$('preveal').style.display='inline-block';$('pinput').disabled=false;$('pinput').focus();if(!wrong.some(w=>w.word.toLowerCase()===english(x).toLowerCase())){wrong.push({word:english(x),parent:x.parent,category:x.category});save();renderWrong()}}}else{if(x._zh&&norm(a)===norm(x._zh)){$('presult').textContent='🎉 正确！';answered=true;$('pinput').disabled=true;$('preveal').style.display='none'}else{$('presult').textContent='❌ 不对，再试一次！';$('preveal').style.display='inline-block';$('pinput').disabled=false;$('pinput').focus()}}}function revealPracticeAnswer(){let x=items[idx];$('presult').innerHTML=mode==='spelling'?\`💡 正确答案：<b>${'${'}esc(english(x))}</b>\`:\`💡 参考答案：<b>${'${'}esc(x._zh||'暂无中文释义')}</b>\`;$('preveal').style.display='none';$('pinput').disabled=true;answered=true}function renderWrong`;
  html=html.replace(oldSubmit,newSubmit);
  html=html.replace("$('psubmit').onclick=submitPractice;", "$('psubmit').onclick=submitPractice;$('preveal').onclick=revealPracticeAnswer;");
  document.open();document.write(html);document.close();
 }catch(e){document.body.innerHTML='<p>加载失败，请刷新页面。</p><pre>'+String(e)+'</pre>'}
})();
</script></body></html>
