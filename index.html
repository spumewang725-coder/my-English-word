<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My English Words</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:960px;margin:auto;padding:30px 18px 60px}h1{margin:0 0 6px}.sub,.small{color:#6b7280;font-size:13px}.card{background:#fff;border:1px solid #e8eaf0;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #00000008}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:10px}textarea{width:100%;min-height:130px;border:1px solid #d8dce5;border-radius:12px;padding:14px;font-size:16px}button,input,select{border-radius:10px;padding:10px 13px;font-size:15px;border:1px solid #d8dce5;background:#fff}button{cursor:pointer}.primary{background:#6d4aff;color:#fff;border-color:#6d4aff}.soft{background:#eef0f5;border-color:#eef0f5}.categories{display:flex;gap:8px;flex-wrap:wrap}.cat.active{background:#6d4aff;color:#fff}.word{display:flex;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid #eee}.word:last-child{border:0}.term{font-size:21px;font-weight:700}.meaning{color:#6b7280;margin-top:4px}.tag{display:inline-block;background:#f0ebff;color:#5b36e8;border-radius:8px;padding:3px 7px;font-size:12px;margin-top:6px}.actions{display:flex;gap:6px;align-items:center}.play{border:0;border-radius:50%;width:42px;height:42px}.empty{text-align:center;color:#999;padding:25px}.practice{display:none}.practice.show{display:block}.practice-word{font-size:30px;font-weight:700;text-align:center;padding:25px}.result{text-align:center;min-height:28px;margin:10px}.wrong{margin-top:15px;padding:12px;background:#fff7f7;border-radius:12px}.manage{margin-top:15px;padding-top:15px;border-top:1px solid #eee}.manage-row{display:flex;gap:8px}.manage-row input{flex:1}.cat-item,.wrong-item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eee}@media(max-width:600px){.word{align-items:flex-start}.term{font-size:18px}}</style></head><body><div class="wrap"><h1>📚 My English Words</h1><div class="sub">单词分类、发音、拼写练习、中文识词。</div><div id="practice" class="card practice"><div><b id="ptitle">✍️ 拼写练习</b><span id="pcat" class="small"></span></div><div id="pword" class="practice-word">🔊 听发音并拼写</div><div class="row"><button class="primary" id="pplay">🔊 播放</button><button class="soft" id="prepeat">再听一次</button></div><input id="pinput" style="width:100%;font-size:19px;text-align:center" placeholder="请输入答案"><div id="presult" class="result"></div><div class="row"><button class="primary" id="psubmit">提交答案</button><button class="soft" id="pnext">下一题 →</button><button class="soft" id="pexit">退出</button></div><div id="pprogress" class="small" style="text-align:center"></div><div class="wrong"><b id="sessionTitle">🔴 本次错题</b><div id="sessionWrong"></div></div></div><div class="card"><b>📂 单词分类</b><div id="categories" class="categories" style="margin-top:10px"></div><div class="manage"><b>⚙️ 管理分类</b><div class="manage-row"><input id="newCat" placeholder="新的分类名称"><button class="primary" id="addCat">＋ 新建</button></div><div id="catManage"></div></div></div><div class="card"><textarea id="input" placeholder="一行一个词条：\nkiwi fruit 猕猴桃\ncredit card 信用卡\ntake a break 休息一下"></textarea><div class="row"><select id="catSelect"></select><button class="primary" id="add">＋ 添加单词</button><button class="soft" id="clear">清空</button></div><div class="small" style="margin-top:8px">格式：英文词/词组 + 空格 + 中文释义。英文词组不会被拆开。</div></div><div class="card"><div class="row" style="margin-top:0"><b>🔊 发音</b><select id="accent"><option value="us">🇺🇸 美式</option><option value="uk">🇬🇧 英式</option></select><button class="soft" id="playAll">▶️ 播放全部</button><button class="primary" id="spell">✍️ 拼写练习</button><button class="primary" id="meaningPractice">🇨🇳 中文识词</button><button class="soft" id="repair">🛠️ 修复词库</button></div><div id="repairMsg" class="small" style="margin-top:8px"></div></div><div class="card"><div id="list" class="empty">还没有单词。</div></div><div class="card"><b>🔴 错题复习</b><div id="wrongList" class="empty">暂时没有错题。</div></div></div><script>
const KEY='myEnglishWordsV2',CATKEY='myEnglishCategoriesV1',WRONGKEY='myEnglishWrongV1';const defaults=['日常生活','商务外贸','汽车汽配','旅行','口语表达','其他'];let categories=JSON.parse(localStorage.getItem(CATKEY)||'null')||defaults.slice(),raw=JSON.parse(localStorage.getItem(KEY)||'[]'),words=raw.map(x=>typeof x==='string'?{word:x,category:'其他'}:x),wrong=JSON.parse(localStorage.getItem(WRONGKEY)||'[]');if(!categories.includes('其他'))categories.push('其他');words.forEach(x=>{if(!x.category||!categories.includes(x.category))x.category='其他'});let selected='全部',items=[],idx=0,mode='spelling',answered=false,sessionWrong=[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(words));localStorage.setItem(CATKEY,JSON.stringify(categories));localStorage.setItem(WRONGKEY,JSON.stringify(wrong))}function english(x){return String(x.word||'').replace(/\s*[\u4e00-\u9fff].*$/,'').trim()||String(x.word||'').trim()}function parseLine(s){s=s.trim();let m=s.match(/^(.*?)\s+([\u4e00-\u9fff][\u4e00-\u9fff\s、，,。；;：:！!?？]*)$/);return m?{word:m[1].trim(),zh:m[2].trim()}:{word:s,zh:''}}function norm(s){return String(s).toLowerCase().replace(/[\s，。！？、,.!?；;：“”‘’'"()（）【】\[\]{}]/g,'')}
function renderCats(){ $('categories').innerHTML=['全部',...categories].map(c=>`<button class="cat ${selected===c?'active':''}" data-c="${esc(c)}">${esc(c)} <span class="small">${c==='全部'?words.length:words.filter(x=>x.category===c).length}</span></button>`).join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{selected=b.dataset.c;render()});$('catSelect').innerHTML=categories.map(c=>`<option>${esc(c)}</option>`).join('');$('catManage').innerHTML=categories.map((c,i)=>`<div class="cat-item"><span>📁 ${esc(c)} (${words.filter(x=>x.category===c).length})</span><span><button class="soft" data-r="${i}">重命名</button>${c!=='其他'?` <button class="soft" data-d="${i}">删除</button>`:''}</span></div>`).join('');document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>renameCat(+b.dataset.r));document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>deleteCat(+b.dataset.d))}
function renameCat(i){let n=prompt('新的分类名称：',categories[i]);if(!n||!n.trim()||categories.includes(n.trim()))return;let old=categories[i];categories[i]=n.trim();words.forEach(x=>{if(x.category===old)x.category=categories[i]});wrong.forEach(x=>{if(x.category===old)x.category=categories[i]});if(selected===old)selected=categories[i];save();render()}function deleteCat(i){let c=categories[i];if(c==='其他'||!confirm(`删除“${c}”并将单词移到“其他”？`))return;words.forEach(x=>{if(x.category===c)x.category='其他'});categories.splice(i,1);if(selected===c)selected='全部';save();render()}
$('addCat').onclick=()=>{let n=$('newCat').value.trim();if(!n||categories.includes(n))return;categories.splice(categories.length-1,0,n);$('newCat').value='';save();render()};$('add').onclick=()=>{let cat=$('catSelect').value,seen=new Set(words.map(x=>english(x).toLowerCase()));$('input').value.split(/\n+/).map(parseLine).filter(x=>x.word).forEach(o=>{let k=o.word.toLowerCase();if(!seen.has(k)){words.push({word:o.word,category:cat,_zh:o.zh});seen.add(k)}else if(o.zh){let x=words.find(w=>english(w).toLowerCase()===k);if(x&&!x._zh)x._zh=o.zh}});$('input').value='';save();render()};$('clear').onclick=()=>{if(confirm('确定清空当前分类吗？')){words=selected==='全部'?[]:words.filter(x=>x.category!==selected);save();render()}};
function speak(w){return new Promise(r=>{if(!speechSynthesis)return r();speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang=$('accent').value==='uk'?'en-GB':'en-US';u.rate=.82;u.onend=r;u.onerror=r;speechSynthesis.speak(u)})}$('playAll').onclick=async()=>{for(let x of words.filter(x=>selected==='全部'||x.category===selected)){await speak(english(x));await new Promise(r=>setTimeout(r,350))}};
function edit(i){let x=words[i],w=prompt('编辑英文单词/词组：',english(x));if(w===null||!w.trim())return;let z=prompt('编辑中文释义：',x._zh||'');if(z===null)return;x.word=w.trim();x._zh=z.trim();save();render()};function render(){renderCats();let shown=words.filter(x=>selected==='全部'||x.category===selected);$('list').className=shown.length?'':'empty';$('list').innerHTML=shown.length?shown.map((x,i)=>{let real=words.indexOf(x);return `<div class="word"><div><div class="term">${esc(english(x))}</div><div class="meaning">${esc(x._zh||'暂无中文释义')}</div><span class="tag">📂 ${esc(x.category)}</span></div><div class="actions"><button class="play" data-p="${esc(english(x))}">🔊</button><button class="soft" data-e="${real}">✏️ 编辑</button><button class="soft" data-x="${real}">删除</button></div></div>`}).join(''):'这个分类还没有单词';document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>speak(b.dataset.p));document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>edit(+b.dataset.e));document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{words.splice(+b.dataset.x,1);save();render()});renderWrong()}
async function translateDirect(text){try{let u='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='+encodeURIComponent(text),r=await fetch(u);if(r.ok){let d=await r.json(),zh=(d[0]||[]).map(x=>x[0]).join('').trim();if(zh)return zh}}catch(e){}try{let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|zh-CN');if(r.ok){let d=await r.json(),zh=d?.responseData?.translatedText?.trim();if(zh&&zh.toLowerCase()!==text.toLowerCase())return zh}}catch(e){}return ''}
async function autoMeaning(x){if(x._zh)return false;let zh=await translateDirect(english(x));if(zh){x._zh=zh;return true}try{let r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(english(x)));if(r.ok){let d=await r.json(),def='';for(let m of d[0]?.meanings||[])if(m.definitions?.[0]){def=m.definitions[0].definition;break}if(def){zh=await translateDirect(def);if(zh){x._zh=zh;return true}}}}catch(e){}return false}
$('repair').onclick=async()=>{let changed=0,added=0,total=words.length;$('repairMsg').textContent=`正在修复 0/${total}，请稍等…`;for(let i=0;i<words.length;i++){let x=words[i],p=parseLine(x.word);if(p.word!==x.word){x.word=p.word;if(p.zh&&!x._zh)x._zh=p.zh;changed++}if(await autoMeaning(x))added++;$('repairMsg').textContent=`正在修复 ${i+1}/${total}… 已补充 ${added} 个中文`;}save();render();$('repairMsg').textContent=`✅ 修复完成：整理 ${changed} 个词条，补充 ${added} 个中文释义。已有中文不会覆盖。`};
function start(m){items=words.filter(x=>selected==='全部'||x.category===selected);if(!items.length)return alert('当前分类还没有单词');items=[...items].sort(()=>Math.random()-.5);idx=0;mode=m;sessionWrong=[];$('practice').classList.add('show');$('ptitle').textContent=m==='spelling'?'✍️ 拼写练习':'🇨🇳 中文识词';showPractice();$('practice').scrollIntoView({behavior:'smooth'})}function showPractice(){let x=items[idx];answered=false;$('pword').textContent=mode==='spelling'?'🔊 听发音并拼写':english(x);$('pinput').value='';$('pinput').disabled=false;$('pinput').placeholder=mode==='spelling'?'请输入你听到的单词':'请输入这个单词的中文意思';$('presult').textContent='';$('pprogress').textContent=`第 ${idx+1} / ${items.length} 题`;$('sessionTitle').textContent=mode==='spelling'?'🔴 本次错题':'📌 本次练习';renderSessionWrong();setTimeout(()=>speak(english(x)),100)}function submit(){if(answered)return;let a=$('pinput').value.trim(),x=items[idx];if(!a)return;answered=true;$('pinput').disabled=true;if(mode==='spelling'){if(a.toLowerCase()===english(x).toLowerCase())$('presult').textContent='🎉 Correct!';else{$('presult').innerHTML=`❌ 正确答案：<b>${esc(english(x))}</b>`;if(!wrong.some(w=>w.word.toLowerCase()===english(x).toLowerCase()))wrong.push({word:english(x),category:x.category});sessionWrong.push(x);save();renderWrong();renderSessionWrong()}}else{let z=x._zh||'';$('presult').innerHTML=z&&norm(a)===norm(z)?'🎉 正确！':`💡 参考中文：<b>${esc(z||'暂无中文释义')}</b>`}}function next(){if(idx<items.length-1){idx++;showPractice()}else{$('presult').textContent='🎉 本次练习完成！';$('pinput').disabled=true}}function renderSessionWrong(){$('sessionWrong').innerHTML=mode==='meaning'?'<div class="small">中文识词不会加入拼写错题本 👍</div>':sessionWrong.length?sessionWrong.map(x=>`<div class="wrong-item">${esc(english(x))} 🔊</div>`).join(''):'<div class="small">本次还没有错题 👍</div>'}function renderWrong(){$('wrongList').innerHTML=wrong.length?wrong.map((x,i)=>`<div class="wrong-item"><span><b>${esc(x.word)}</b><div class="small">📂 ${esc(x.category)}</div></span><button class="soft" data-wd="${i}">移除</button></div>`).join(''):'暂时没有错题。';document.querySelectorAll('[data-wd]').forEach(b=>b.onclick=()=>{wrong.splice(+b.dataset.wd,1);save();renderWrong()})}
$('spell').onclick=()=>start('spelling');$('meaningPractice').onclick=()=>start('meaning');$('pplay').onclick=()=>speak(english(items[idx]));$('prepeat').onclick=()=>speak(english(items[idx]));$('psubmit').onclick=submit;$('pnext').onclick=next;$('pexit').onclick=()=>$('practice').classList.remove('show');$('pinput').onkeydown=e=>{if(e.key==='Enter')submit()};save();render();</script></body></html>
