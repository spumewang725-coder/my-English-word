<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My English Words</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:960px;margin:auto;padding:36px 18px 60px}h1{font-size:34px;margin:0 0 8px}.sub,.small{color:#6b7280;font-size:13px}.card{background:#fff;border:1px solid #e8eaf0;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 25px #00000008}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}textarea{width:100%;min-height:150px;border:1px solid #d8dce5;border-radius:12px;padding:14px;font-size:16px;resize:vertical}button,select,input{border:0;border-radius:10px;padding:10px 14px;font-size:15px}button{cursor:pointer}.primary{background:#6d4aff;color:#fff}.soft{background:#eef0f5;color:#333}select,input{border:1px solid #d8dce5;background:#fff}.category-title{font-size:16px;font-weight:700;margin-bottom:10px}.categories{display:flex;gap:8px;flex-wrap:wrap}.cat{background:#eef0f5;color:#444}.cat.active{background:#6d4aff;color:#fff}.cat .num{opacity:.7;font-size:12px;margin-left:4px}.manage{margin-top:14px;padding-top:14px;border-top:1px solid #eee}.manage-row{display:flex;gap:8px;flex-wrap:wrap}.manage-row input{flex:1;min-width:160px}.cat-manage{display:flex;flex-direction:column;gap:8px;margin-top:10px}.cat-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:#f7f8fb;border-radius:10px}.cat-name{flex:1}.word{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid #eee}.word:last-child{border-bottom:0}.term{font-size:22px;font-weight:700}.meaning{color:#6b7280;margin-top:5px;font-size:14px}.tag{display:inline-block;background:#f0ebff;color:#5b36e8;border-radius:8px;padding:3px 7px;font-size:12px;margin-top:7px}.actions{display:flex;gap:7px;align-items:center}.play{width:44px;height:44px;border-radius:50%;background:#eee8ff;color:#5b36e8;font-size:19px;padding:0}.empty{text-align:center;color:#999;padding:30px}.practice-panel{display:none}.practice-panel.show{display:block}.practice-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.practice-word{font-size:30px;font-weight:700;text-align:center;padding:25px 10px}.practice-input{width:100%;font-size:20px;text-align:center;padding:14px}.practice-result{text-align:center;min-height:30px;margin:12px 0;font-weight:600}.wrong-box{margin-top:18px;padding:14px;background:#fff7f7;border-radius:12px}.wrong-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.wrong-item:last-child{border-bottom:0}.progress{text-align:center;color:#6b7280;margin-top:8px}@media(max-width:600px){h1{font-size:28px}.word{align-items:flex-start}.actions{flex-shrink:0}.term{font-size:19px}}
</style>
</head>
<body><div class="wrap">
<h1>📚 My English Words</h1><div class="sub">把想学的单词分类保存，直接听标准发音。</div>
<div id="practice" class="card practice-panel"><div class="practice-head"><strong id="practiceTitle">✍️ 听音拼写练习</strong><span id="practiceCategory" class="small"></span></div><div id="practiceWord" class="practice-word">🔊 听发音并拼写</div><div class="row"><button class="primary" id="practicePlay">🔊 播放</button><button class="soft" id="practiceRepeat">再听一次</button></div><input id="practiceInput" class="practice-input" autocomplete="off" placeholder="请输入你听到的单词"><div id="practiceResult" class="practice-result"></div><div class="row"><button class="primary" id="practiceSubmit">提交答案</button><button class="soft" id="practiceNext">下一题 →</button><button class="soft" id="practiceExit">退出练习</button></div><div id="practiceProgress" class="progress"></div><div class="wrong-box"><strong id="sessionTitle">🔴 本次错题</strong><div id="sessionWrong"></div></div></div>
<div class="card"><div class="category-title">📂 单词分类</div><div id="categories" class="categories"></div><div class="manage"><div class="category-title">⚙️ 管理分类</div><div class="manage-row"><input id="newCategory" placeholder="输入新的分类名称"><button class="primary" id="addCategory">＋ 新建分类</button></div><div id="categoryManage" class="cat-manage"></div></div></div>
<div class="card"><textarea id="input" placeholder="例如：embark\nexclude\ndevastating\ntorrents\ndebris"></textarea><div class="row"><select id="addCategorySelect"></select><button class="primary" id="add">＋ 添加单词</button><button class="soft" id="clear">清空</button><span class="small" id="count"></span></div></div>
<div class="card"><div class="row" style="margin-top:0"><strong>🔊 发音</strong><select id="accent"><option value="us">🇺🇸 美式</option><option value="uk">🇬🇧 英式</option></select><button class="soft" id="playAll">▶️ 播放全部</button><button class="primary" id="startPractice">✍️ 拼写练习</button><button class="primary" id="startMeaningPractice">🇨🇳 中文识词</button><span id="status" class="small"></span></div></div>
<div class="card"><div id="list" class="empty">还没有单词。</div></div>
<div class="card"><div class="category-title">🔴 错题复习</div><div class="small" style="margin-bottom:8px">这里会保存听音拼写练习中答错的单词。</div><div id="wrongList" class="empty">暂时没有错题。</div></div>
</div>
<script>
const KEY="myEnglishWordsV2",CATKEY="myEnglishCategoriesV1",WRONGKEY="myEnglishWrongV1";const defaultCategories=["日常生活","商务外贸","汽车汽配","旅行","口语表达","其他"];
let categories=JSON.parse(localStorage.getItem(CATKEY)||"null")||defaultCategories.slice();let rawWords=JSON.parse(localStorage.getItem(KEY)||"[]");let words=rawWords.map(x=>typeof x==='string'?{word:x,category:"其他"}:x);let wrongWords=JSON.parse(localStorage.getItem(WRONGKEY)||"[]");if(!categories.includes("其他"))categories.push("其他");words.forEach(x=>{if(!x.category||!categories.includes(x.category))x.category="其他"});let selectedCategory="全部",practiceItems=[],practiceIndex=0,sessionWrong=[],answered=false,practiceMode="spelling";const audioCache=new Map();
function save(){localStorage.setItem(KEY,JSON.stringify(words));localStorage.setItem(CATKEY,JSON.stringify(categories));localStorage.setItem(WRONGKEY,JSON.stringify(wrongWords))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function countCat(c){return words.filter(x=>x.category===c).length}
function practiceEnglish(x){const s=String(x?.word||"").trim();const m=s.match(/[A-Za-z][A-Za-z'’-]*/);return m?m[0]:s.split(/[\s，,：:；;（）()]+/)[0]||s}
function renderCategories(){const box=document.getElementById("categories"),all=["全部",...categories];box.innerHTML=all.map(c=>`<button class="cat ${selectedCategory===c?'active':''}" data-cat="${esc(c)}">${esc(c)}<span class="num">${c==='全部'?words.length:countCat(c)}</span></button>`).join('');box.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{selectedCategory=b.dataset.cat;render()});const sel=document.getElementById("addCategorySelect");sel.innerHTML=categories.map(c=>`<option value="${esc(c)}">📂 ${esc(c)}</option>`).join('');const cm=document.getElementById("categoryManage");cm.innerHTML=categories.map((c,i)=>`<div class="cat-item"><span class="cat-name">📁 ${esc(c)} <span class="small">(${countCat(c)} 个)</span></span><button class="soft" data-rename="${i}">重命名</button>${c!=="其他"?`<button class="soft" data-deletecat="${i}">删除</button>`:""}</div>`).join('');cm.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>renameCategory(+b.dataset.rename));cm.querySelectorAll('[data-deletecat]').forEach(b=>b.onclick=()=>deleteCategory(+b.dataset.deletecat))}
function renameCategory(i){const old=categories[i],name=prompt("请输入新的分类名称：",old);if(!name||!name.trim()||name.trim()===old)return;const n=name.trim();if(categories.includes(n)){alert("这个分类已经存在。");return}categories[i]=n;words.forEach(x=>{if(x.category===old)x.category=n});wrongWords.forEach(x=>{if(x.category===old)x.category=n});if(selectedCategory===old)selectedCategory=n;save();render()}
function deleteCategory(i){const c=categories[i];if(c==='其他')return;if(!confirm(`删除“${c}”后，该分类的单词会移动到“其他”。确定吗？`))return;words.forEach(x=>{if(x.category===c)x.category='其他'});wrongWords.forEach(x=>{if(x.category===c)x.category='其他'});categories.splice(i,1);if(selectedCategory===c)selectedCategory='全部';save();render()}
document.getElementById("addCategory").onclick=()=>{const input=document.getElementById("newCategory"),name=input.value.trim();if(!name)return;if(categories.includes(name)){alert("这个分类已经存在。");return}categories.splice(categories.length-1,0,name);input.value="";save();renderCategories()};document.getElementById("add").onclick=()=>{const input=document.getElementById("input"),cat=document.getElementById("addCategorySelect").value,incoming=input.value.split(/[\s,，、;；]+/).map(x=>x.trim()).filter(Boolean),seen=new Set(words.map(x=>x.word.toLowerCase()));for(const w of incoming)if(!seen.has(w.toLowerCase())){words.push({word:w,category:cat});seen.add(w.toLowerCase())}input.value="";save();render()};document.getElementById("clear").onclick=()=>{if(confirm("确定清空当前分类里的单词吗？")){if(selectedCategory==='全部')words=[];else words=words.filter(x=>x.category!==selectedCategory);audioCache.clear();save();render()}};
function systemSpeak(word){return new Promise(resolve=>{if(!('speechSynthesis'in window)){resolve(false);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang=document.getElementById("accent").value==='uk'?'en-GB':'en-US';u.rate=.82;const voices=speechSynthesis.getVoices(),wanted=u.lang,voice=voices.find(v=>v.lang===wanted)||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(wanted.slice(0,2)));if(voice)u.voice=voice;u.onend=()=>resolve(true);u.onerror=()=>resolve(false);speechSynthesis.speak(u)})}
async function play(word){const key=word.toLowerCase(),url=audioCache.get(key);if(url){try{const a=new Audio(url);await a.play();return}catch(e){}}await systemSpeak(word)}document.getElementById("playAll").onclick=async()=>{const list=words.filter(x=>selectedCategory==='全部'||x.category===selectedCategory);for(const x of list){await play(x.word);await new Promise(r=>setTimeout(r,450))}};
async function lookupMeaning(word,i){try{const r=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(word));if(!r.ok)throw 0;const d=await r.json(),item=d[0];let meaning="",audio="";for(const p of item.phonetics||[])if(p.audio&&!audio)audio=p.audio;if(audio){if(audio.startsWith("//"))audio="https:"+audio;audioCache.set(word.toLowerCase(),audio)}for(const m of item.meanings||[])if(m.definitions?.[0]){meaning=m.definitions[0].definition;break}const x=words.find(w=>w.word===word);if(x&&meaning&&!x._meaning)x._meaning=meaning;const me=document.getElementById("mean"+i);if(me)me.textContent=meaning||"暂无释义";if(meaning)fetchChinese(word,meaning)}catch{const me=document.getElementById("mean"+i);if(me)me.textContent="暂无释义"}}
async function fetchChinese(word,englishMeaning){try{const q=encodeURIComponent(englishMeaning);const r=await fetch(`https://api.mymemory.translated.net/get?q=${q}&langpair=en|zh-CN`);if(!r.ok)return;const d=await r.json(),zh=d?.responseData?.translatedText;if(zh){const x=words.find(w=>w.word===word);if(x){x._zh=zh;save()}}}catch(e){}}
function render(){renderCategories();const list=document.getElementById("list"),shown=words.filter(x=>selectedCategory==='全部'||x.category===selectedCategory);document.getElementById("count").textContent=shown.length?`当前 ${shown.length} 个`:"";if(!shown.length){list.className="empty";list.textContent="这个分类还没有单词"}else{list.className="";list.innerHTML=shown.map((x,i)=>`<div class="word"><div><div><span class="term">${esc(x.word)}</span></div><div class="meaning" id="mean${i}">${esc(x._zh||"正在查询中文释义…")}</div><span class="tag">📂 ${esc(x.category)}</span></div><div class="actions"><button class="play" data-play="${esc(x.word)}">🔊</button><button class="soft" data-del="${esc(x.word)}">删除</button></div></div>`).join('');list.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>play(b.dataset.play));list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const w=b.dataset.del,idx=words.findIndex(x=>x.word===w&&(selectedCategory==='全部'||x.category===selectedCategory));if(idx>=0){words.splice(idx,1);save();render()}});shown.forEach((x,i)=>{if(!x._zh||!x._meaning)lookupMeaning(x.word,i)})}renderWrong()}
function startPractice(mode){practiceItems=words.filter(x=>selectedCategory==='全部'||x.category===selectedCategory);if(!practiceItems.length){alert("当前分类还没有单词，请先添加单词。");return}practiceItems=[...practiceItems].sort(()=>Math.random()-.5);practiceIndex=0;sessionWrong=[];answered=false;practiceMode=mode;document.getElementById("practice").classList.add('show');document.getElementById("practiceCategory").textContent=selectedCategory==='全部'?'全部分类':selectedCategory;document.getElementById("practiceTitle").textContent=mode==='spelling'?"✍️ 听音拼写练习":"🇨🇳 中文识词练习";document.getElementById("sessionTitle").textContent=mode==='spelling'?"🔴 本次错题":"📌 本次练习";showPractice();document.getElementById("practice").scrollIntoView({behavior:'smooth'})}
function showPractice(){const x=practiceItems[practiceIndex],english=practiceEnglish(x);answered=false;document.getElementById("practiceWord").textContent=practiceMode==='spelling'?"🔊 听发音并拼写":english;document.getElementById("practiceInput").value="";document.getElementById("practiceInput").disabled=false;document.getElementById("practiceInput").placeholder=practiceMode==='spelling'?"请输入你听到的单词":"请输入这个单词的中文意思";document.getElementById("practiceResult").textContent="";document.getElementById("practiceProgress").textContent=`第 ${practiceIndex+1} / ${practiceItems.length} 题`;document.getElementById("practicePlay").style.display='inline-block';document.getElementById("practiceRepeat").style.display='inline-block';document.getElementById("practiceSubmit").textContent=practiceMode==='spelling'?"提交答案":"提交中文释义";renderSessionWrong();setTimeout(()=>play(english),100)}
function normalizeZh(s){return String(s).toLowerCase().replace(/[\s，。！？、,.!?；;：“”‘’'"()（）【】\[\]{}]/g,'')}
function submitPractice(){if(answered)return;const input=document.getElementById("practiceInput"),answer=input.value.trim(),x=practiceItems[practiceIndex],english=practiceEnglish(x);if(!answer)return;answered=true;input.disabled=true;if(practiceMode==='spelling'){if(answer.toLowerCase()===english.toLowerCase())document.getElementById("practiceResult").textContent="🎉 Correct!";else{document.getElementById("practiceResult").innerHTML=`❌ 正确答案：<strong>${esc(english)}</strong>`;if(!wrongWords.some(w=>w.word.toLowerCase()===english.toLowerCase()))wrongWords.push({word:english,category:x.category});if(!sessionWrong.some(w=>w.word.toLowerCase()===english.toLowerCase()))sessionWrong.push({word:english,category:x.category});save();renderWrong();renderSessionWrong()}}else{const expected=x._zh||"";if(expected&&normalizeZh(answer)===normalizeZh(expected))document.getElementById("practiceResult").textContent="🎉 正确！";else document.getElementById("practiceResult").innerHTML=`💡 参考中文：<strong>${esc(expected||"暂时无法自动获取中文释义")}</strong>`}}
function nextPractice(){if(practiceIndex<practiceItems.length-1){practiceIndex++;showPractice()}else{document.getElementById("practiceResult").textContent="🎉 本次练习完成！";document.getElementById("practiceProgress").textContent=`共完成 ${practiceItems.length} 题`;document.getElementById("practiceInput").disabled=true}}
document.getElementById("startPractice").onclick=()=>startPractice('spelling');document.getElementById("startMeaningPractice").onclick=()=>startPractice('meaning');document.getElementById("practicePlay").onclick=()=>play(practiceEnglish(practiceItems[practiceIndex]));document.getElementById("practiceRepeat").onclick=()=>play(practiceEnglish(practiceItems[practiceIndex]));document.getElementById("practiceSubmit").onclick=submitPractice;document.getElementById("practiceNext").onclick=nextPractice;document.getElementById("practiceExit").onclick=()=>document.getElementById("practice").classList.remove('show');document.getElementById("practiceInput").addEventListener('keydown',e=>{if(e.key==='Enter')submitPractice()});
function renderSessionWrong(){const box=document.getElementById("sessionWrong");if(practiceMode==='meaning'){box.innerHTML='<div class="small" style="margin-top:8px">中文识词不会加入英文拼写错题本。👍</div>';return}if(!sessionWrong.length){box.innerHTML='<div class="small" style="margin-top:8px">本次还没有错题 👍</div>';return}box.innerHTML=sessionWrong.map(x=>`<div class="wrong-item"><span>${esc(x.word)}</span><button class="soft" data-session-play="${esc(x.word)}">🔊</button></div>`).join('');box.querySelectorAll('[data-session-play]').forEach(b=>b.onclick=()=>play(b.dataset.sessionPlay))}
function renderWrong(){const box=document.getElementById("wrongList");if(!wrongWords.length){box.className='empty';box.textContent='暂时没有错题。';return}box.className='';box.innerHTML=wrongWords.map((x,i)=>`<div class="wrong-item"><div><strong>${esc(x.word)}</strong><div class="small">📂 ${esc(x.category)}</div></div><div class="actions"><button class="play" data-wrong-play="${esc(x.word)}">🔊</button><button class="soft" data-wrong-del="${i}">移除</button></div></div>`).join('');box.querySelectorAll('[data-wrong-play]').forEach(b=>b.onclick=()=>play(b.dataset.wrongPlay));box.querySelectorAll('[data-wrong-del]').forEach(b=>b.onclick=()=>{wrongWords.splice(+b.dataset.wrongDel,1);save();renderWrong()})}
save();render();
</script></body></html>
