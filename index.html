<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My English Words</title></head><body><div id="loading">正在加载词库…</div><script>
(async()=>{
 const url='https://raw.githubusercontent.com/spumewang725-coder/my-English-word/05891aec87447e4831d97d6ecbd568a76f278a3a/index.html';
 try{
  let html=await (await fetch(url)).text();
  const old=/function parseLine\(s\).*?function scopeWords\(\)/s;
  const fixed=`function parseLine(s){s=String(s||'').trim();if(!s)return null;let m=s.match(/^(.+?)\s*[-–—]\s*([\u4e00-\u9fff][\u4e00-\u9fff\s、，,。；;：:！!?？]*)$/);if(m)return {word:m[1].trim(),zh:m[2].trim()};m=s.match(/^(.*?)\s+([\u4e00-\u9fff][\u4e00-\u9fff\s、，,。；;：:！!?？]*)$/);return m?{word:m[1].trim(),zh:m[2].trim()}:{word:s,zh:''}}function parseBulk(text){let lines=String(text||'').replace(/\r/g,'').split(/\n+/).map(x=>x.trim()).filter(Boolean),out=[];lines.forEach(line=>{let re=/([A-Za-z][A-Za-z0-9'&]*(?:\s+[A-Za-z][A-Za-z0-9'&]*)*)\s*[-–—]\s*([\u4e00-\u9fff][^\s]*?)(?=\s+[A-Za-z][A-Za-z0-9'&]*(?:\s+[A-Za-z][A-Za-z0-9'&]*)*\s*[-–—]|$)/g,m,found=false;while((m=re.exec(line))){out.push({word:m[1].trim(),zh:m[2].trim()});found=true}if(!found){let x=parseLine(line);if(x)out.push(x)}});return out}function scopeWords()`;
  html=html.replace(old,fixed);
  html=html.replace('格式：英文词/词组 + 空格 + 中文释义。支持 69、100、200 个词一次性添加。','格式支持：Potatoes-土豆，也支持 kiwi fruit 猕猴桃；一行可放多个词条。');
  document.open();document.write(html);document.close();
 }catch(e){document.body.innerHTML='<p>加载失败，请刷新页面。</p><pre>'+String(e)+'</pre>'}
})();
</script></body></html>
