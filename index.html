<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My English Words</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:30px 18px 60px}h1{margin:0 0 6px}.sub,.small{color:#6b7280;font-size:13px}.card{background:#fff;border:1px solid #e8eaf0;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #00000008}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:10px}textarea{width:100%;min-height:160px;border:1px solid #d8dce5;border-radius:12px;padding:14px;font-size:16px}button,input,select{border-radius:10px;padding:10px 13px;font-size:15px;border:1px solid #d8dce5;background:#fff}button{cursor:pointer}.primary{background:#6d4aff;color:#fff;border-color:#6d4aff}.soft{background:#eef0f5;border-color:#eef0f5}.tabs,.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.subtabs{padding:10px;background:#f8f8fb;border-radius:12px}.tab.active{background:#6d4aff;color:#fff}.subtab.active{background:#e8e0ff;color:#5732db;border-color:#e8e0ff}.count{font-size:12px;opacity:.7}.word{display:flex;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid #eee}.term{font-size:21px;font-weight:700}.meaning{color:#6b7280;margin-top:4px}.tag{display:inline-block;background:#f0ebff;color:#5b36e8;border-radius:8px;padding:3px 7px;font-size:12px;margin-top:6px}.actions{display:flex;gap:6px;align-items:center}.play{border:0;border-radius:50%;width:42px;height:42px}.empty{text-align:center;color:#999;padding:25px}.practice{display:none}.practice.show{display:block}.practice-word{font-size:30px;font-weight:700;text-align:center;padding:25px}.result{text-align:center;min-height:28px;margin:10px}.wrong{margin-top:15px;padding:12px;background:#fff7f7;border-radius:12px}.manage{margin-top:15px;padding-top:15px;border-top:1px solid #eee}.manage-row{display:flex;gap:8px;flex-wrap:wrap}.manage-row input{flex:1;min-width:180px}.section{margin-top:14px;padding-top:14px;border-top:1px solid #eee}.manage-parent{padding:10px 0}.parent-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}.child-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;padding-left:8px}.child-item{display:flex;align-items:center;gap:4px;background:#f6f7fa;border-radius:9px;padding:5px 7px}.child-item button{padding:4px 7px;font-size:12px;border:0;background:transparent}.import-msg{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f6f4ff;color:#5732db}@media(max-width:600px){.word{align-items:flex-start}.term{font-size:18px}.actions{flex-wrap:wrap}.practice-word{font-size:25px}}</style></head><body><div class="wrap"><h1>📚 My English Words</h1><div class="sub">大分类 → 小分类 → 单词。练习可以精确到每一个小分类。</div><div id="practice" class="card practice"><div><b id="ptitle">✍️ 拼写练习</b> <span id="pcat" class="small"></span></div><div id="pword" class="practice-word">🔊 听发音并拼写</div><div class="row"><button class="primary" id="pplay">🔊 播放</button><button class="soft" id="prepeat">再听一次</button></div><input id="pinput" style="width:100%;font-size:19px;text-align:center" placeholder="请输入答案"><div id="presult" class="result"></div><div class="row"><button class="primary" id="psubmit">提交答案</button><button class="soft" id="pnext">下一题 →</button><button class="soft" id="pexit">退出</button></div><div id="pprogress" class="small" style="text-align:center"></div><div class="wrong"><b>🔴 本次错题</b></div></div><div class="card"><b>📂 单词分类</b><div id="parents" class="tabs"></div><div id="children" class="subtabs"></div><div class="small" style="margin-top:8px">当前范围：<b id="scope"></b></div><div class="manage"><b>⚙️ 管理分类</b><div class="section" style="padding-top:0;border:0"><div class="manage-row"><input id="newParent" placeholder="新建大分类"><button class="primary" id="addParent">＋ 大分类</button></div></div><div class="section"><div class="manage-row"><input id="newChild" placeholder="先选择大分类，再输入小分类"><button class="primary" id="addChild">＋ 小分类</button></div></div><div class="section"><b>编辑分类名称</b><div id="manageList"></div></div></div></div><div class="card"><textarea id="input" placeholder="一行一个词条，例如：\nkiwi fruit 猕猴桃\ncredit card 信用卡\ntake a break 休息一下"></textarea><div class="row"><select id="parentSelect"></select><select id="childSelect"></select><button class="primary" id="add">＋ 添加单词</button><button class="soft" id="clear">清空当前范围</button></div><div class="small" style="margin-top:8px">格式：英文词/词组 + 空格 + 中文释义。支持 69、100、200 个词一次性添加。</div><div id="importMsg" class="import-msg" style="display:none"></div></div><div class="card"><div class="row" style="margin-top:0"><b>🔊 发音</b><select id="accent"><option value="us">🇺🇸 美式</option><option value="uk">🇬🇧 英式</option></select><button class="soft" id="playAll">▶️ 播放当前范围</button><button class="primary" id="spell">✍️ 拼写练习</button><button class="primary" id="meaningPractice">🇨🇳 中文识词</button><button class="soft" id="repair">🛠️ 修复词库</button></div><div id="repairMsg" class="small" style="margin-top:8px"></div></div><div class="card"><div id="list" class="empty">还没有单词。</div></div><div class="card"><b>🔴 错题复习</b><div id="wrongList" class="empty">暂时没有错题。</div></div></div><script>
const KEY='myEnglishWordsV2',CAT='myEnglishCategoriesV1',TREE='myEnglishCategoryTreeV1',WRONG='myEnglishWrongV1';const defaults=['日常生活','商务外贸','汽车汽配','旅行','口语表达','其他'];const defaultKids={日常生活:['水果蔬菜','海鲜','职业','家庭','购物','交通','身体健康','天气'],商务外贸:['邮件表达','报价付款','订单交期','客户沟通'],汽车汽配:['发动机','底盘悬挂','制动系统','空调系统','电气系统'],旅行:['机场交通','酒店住宿','餐厅点餐','旅游景点'],口语表达:['日常交流','社交表达','情绪感受'],其他:['未分类']};let categories=JSON.parse(localStorage.getItem(CAT)||'null');if(!Array.isArray(categories)||categories.length===0)categories=defaults.slice();let savedTree=JSON.parse(localStorage.getItem(TREE)||'null'),tree={};categories.forEach(p=>tree[p]=savedTree&&Array.isArray(savedTree[p])&&savedTree[p].length?savedTree[p].slice():(defaultKids[p]||['未分类']).slice());if(!tree.其他)tree.其他=['未分类'];if(!categories.includes('其他'))categories.push('其他');let words=JSON.parse(localStorage.getItem(KEY)||'[]').map(x=>typeof x==='string'?{word:x,parent:'其他',category:'未分类',_zh:''}:x);let wrong=JSON.parse(localStorage.getItem(WRONG)||'[]');words.forEach(x=>{if(!x.parent||!tree[x.parent])x.parent='其他';if(!x.category||!tree[x.parent].includes(x.category))x.category=tree[x.parent][0]||'未分类';if(x._zh==null&&x.zh)x._zh=x.zh});let selectedParent=categories.includes('日常生活')?'日常生活':categories[0],selectedChild='__ALL__',items=[],idx=0,mode='spelling',answered=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(words));localStorage.setItem(CAT,JSON.stringify(categories));localStorage.setItem(TREE,JSON.stringify(tree));localStorage.setItem(WRONG,JSON.stringify(wrong))}function english(x){return String(x.word||'').replace(/\s*[\u4e00-\u9fff].*$/,'').trim()}
function parseLine(s){s=String(s).replace(/^\s+|\s+$/g,'');if(!s)return null;s=s.replace(/\\n/g,'\n').trim();let m=s.match(/^(.*?)\s*([\u4e00-\u9fff][\u4e00-\u9fff\s、，,。；;：:！!?？]*)$/);if(!m)return {word:s,zh:''};let word=m[1].trim(),zh=m[2].trim();return word?{word,zh}:null}function parseBulk(text){let normalized=String(text||'').replace(/\\r?\\n/g,'\n').replace(/\r/g,'\n');let lines=normalized.split(/\n+/).map(x=>x.trim()).filter(Boolean);let out=[];lines.forEach(line=>{let x=parseLine(line);if(x)out.push(x)});return out}function scopeWords(){return words.filter(x=>x.parent===selectedParent&&(selectedChild==='__ALL__'||x.category===selectedChild))}function fillChildSelect(){let p=$('parentSelect').value,kids=tree[p]||[];$('childSelect').innerHTML=kids.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(p===selectedParent&&selectedChild!=='__ALL__'&&kids.includes(selectedChild))$('childSelect').value=selectedChild)}
function renderCats(){let ph='';categories.forEach(p=>ph+=`<button class="tab ${p===selectedParent?'active':''}" data-parent="${esc(p)}">📁 ${esc(p)} <span class="count">${words.filter(x=>x.parent===p).length}</span></button>`);$('parents').innerHTML=ph;document.querySelectorAll('[data-parent]').forEach(b=>b.onclick=()=>{selectedParent=b.dataset.parent;selectedChild='__ALL__';render()});let kids=tree[selectedParent]||[];$('children').innerHTML=`<button class="subtab ${selectedChild==='__ALL__'?'active':''}" data-child="__ALL__">全部 <span class="count">${words.filter(x=>x.parent===selectedParent).length}</span></button>`+kids.map(c=>`<button class="subtab ${selectedChild===c?'active':''}" data-child="${esc(c)}">${esc(c)} <span class="count">${words.filter(x=>x.parent===selectedParent&&x.category===c).length}</span></button>`).join('');document.querySelectorAll('[data-child]').forEach(b=>b.onclick=()=>{selectedChild=b.dataset.child;render()});$('scope').textContent=selectedParent+(selectedChild==='__ALL__'?' → 全部小分类':' → '+selectedChild);$('parentSelect').innerHTML=categories.map(p=>`<option value="${esc(p)}">📁 ${esc(p)}</option>`).join('');$('parentSelect').value=selectedParent;fillChildSelect();renderManage()}
function renderManage(){$('manageList').innerHTML=categories.map((p,i)=>`<div class="manage-parent"><div class="parent-head"><span>📁 ${esc(p)} (${words.filter(x=>x.parent===p).length})</span><span><button class="soft" data-rp="${i}">✏️ 重命名</button>${p!=='其他'?` <button class="soft" data-dp="${i}">🗑️ 删除</button>`:''}</span></div><div class="child-list">${(tree[p]||[]).map((c,j)=>`<span class="child-item">${esc(c)} <button data-rc="${i}:${j}">✏️</button>${tree[p].length>1?`<button data-dc="${i}:${j}">×</button>`:''}</span>`).join('')}</div></div>`).join('');document.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>renameParent(+b.dataset.rp));document.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>deleteParent(+b.dataset.dp));document.querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.rc.split(':').map(Number);renameChild(i,j)});document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.dc.split(':').map(Number);deleteChild(i,j)})}
function renameParent(i){let old=categories[i],n=prompt('新的大分类名称：',old);if(!n)return;n=n.trim();if(!n||categories.includes(n))return alert('分类名称已存在或为空');categories[i]=n;tree[n]=tree[old];delete tree[old];words.forEach(x=>{if(x.parent===old)x.parent=n});wrong.forEach(x=>{if(x.parent===old)x.parent=n});if(selectedParent===old)selectedParent=n;save();render()}function deleteParent(i){let old=categories[i];if(old==='其他')return;if(!confirm(`删除“${old}”，其中单词移动到“其他”？`))return;words.forEach(x=>{if(x.parent===old){x.parent='其他';x.category='未分类'}});delete tree[old];categories.splice(i,1);selectedParent='其他';selectedChild='__ALL__';save();render()}
$('addParent').onclick=function(){let n=$('newParent').value.trim();if(!n)return alert('请输入大分类名称');if(categories.includes(n))return alert('这个大分类已经存在');categories.push(n);tree[n]=['未分类'];$('newParent').value='';selectedParent=n;selectedChild='__ALL__';save();render()};$('addChild').onclick=function(){let p=selectedParent,n=$('newChild').value.trim();if(!n)return alert('请输入小分类名称');if(!tree[p])tree[p]=['未分类'];if(tree[p].includes(n))return alert('这个小分类已经存在');tree[p].push(n);$('newChild').value='';selectedChild=n;save();render()};$('parentSelect').onchange=function(){selectedParent=this.value;selectedChild='__ALL__';fillChildSelect();render()};function renameChild(pi,ci){let p=categories[pi],old=tree[p][ci],n=prompt('新的小分类名称：',old);if(!n)return;n=n.trim();if(!n||tree[p].includes(n))return alert('小分类名称已存在或为空');tree[p][ci]=n;words.forEach(x=>{if(x.parent===p&&x.category===old)x.category=n});wrong.forEach(x=>{if(x.parent===p&&x.category===old)x.category=n});if(selectedParent===p&&selectedChild===old)selectedChild=n;save();render()}function deleteChild(pi,ci){let p=categories[pi],old=tree[p][ci];if(tree[p].length<=1)return alert('至少保留一个小分类');if(!confirm(`删除“${old}”，其中单词移动到其他小分类？`))return;let target=tree[p].find(x=>x!==old);words.forEach(x=>{if(x.parent===p&&x.category===old)x.category=target});tree[p].splice(ci,1);if(selectedParent===p&&selectedChild===old)selectedChild='__ALL__';save();render()}
$('add').onclick=function(){let p=$('parentSelect').value,c=$('childSelect').value,data=parseBulk($('input').value);if(!data.length)return alert('没有识别到有效词条');let seen=new Set(words.map(x=>english(x).toLowerCase())),added=0,updated=0,duplicates=0;data.forEach(o=>{let k=o.word.toLowerCase();if(!seen.has(k)){words.push({word:o.word,parent:p,category:c,_zh:o.zh||''});seen.add(k);added++}else{let x=words.find(w=>english(w).toLowerCase()===k);if(x&&o.zh&&!x._zh){x._zh=o.zh;updated++}else duplicates++}});$('input').value='';selectedParent=p;selectedChild=c;save();render();let msg=`✅ 本次识别 ${data.length} 条：成功新增 ${added} 条`;if(updated)msg+=`，补充中文 ${updated} 条`;if(duplicates)msg+=`，重复跳过 ${duplicates} 条`;$('importMsg').style.display='block';$('importMsg').textContent=msg};$('clear').onclick=function(){let a=scopeWords();if(!a.length)return alert('当前范围没有单词');if(confirm(`清空 ${selectedParent}${selectedChild==='__ALL__'?'':' → '+selectedChild}？`)){let set=new Set(a);words=words.filter(x=>!set.has(x));save();render()}};
function speak(text){return new Promise(resolve=>{if(!window.speechSynthesis)return resolve();speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=$('accent').value==='uk'?'en-GB':'en-US';u.rate=.82;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)})}$('playAll').onclick=async()=>{for(let x of scopeWords()){await speak(english(x));await new Promise(r=>setTimeout(r,350))}};function editWord(i){let x=words[i],w=prompt('编辑英文单词/词组：',english(x));if(w===null||!w.trim())return;let z=prompt('编辑中文释义：',x._zh||'');if(z===null)return;x.word=w.trim();x._zh=z.trim();save();render()}function renderList(){let a=scopeWords();$('list').innerHTML=a.length?a.map(x=>{let i=words.indexOf(x);return `<div class="word"><div><div class="term">${esc(english(x))}</div><div class="meaning">${esc(x._zh||'暂无中文释义')}</div><span class="tag">📁 ${esc(x.parent)} · ${esc(x.category)}</span></div><div class="actions"><button class="play" data-play="${esc(english(x))}">🔊</button><button class="soft" data-edit="${i}">✏️ 编辑</button><button class="soft" data-del="${i}">删除</button></div></div>`}).join(''):'<div class="empty">这个分类还没有单词。</div>';document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>speak(b.dataset.play));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editWord(+b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{words.splice(+b.dataset.del,1);save();render()})}
async function translateDirect(text){try{let r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='+encodeURIComponent(text));if(r.ok){let d=await r.json(),z=(d[0]||[]).map(x=>x[0]).join('').trim();if(z)return z}}catch(e){}try{let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|zh-CN');if(r.ok){let d=await r.json(),z=(d.responseData?.translatedText||'').trim();if(z&&z.toLowerCase()!==text.toLowerCase())return z}}catch(e){}return ''}$('repair').onclick=async()=>{let n=0,total=words.length;$('repairMsg').textContent=`正在修复 0/${total}…`;for(let i=0;i<words.length;i++){if(!words[i]._zh){let z=await translateDirect(english(words[i]));if(z){words[i]._zh=z;n++}}$('repairMsg').textContent=`正在修复 ${i+1}/${total}… 已补充 ${n} 个中文`}save();render();$('repairMsg').textContent=`✅ 修复完成：补充 ${n} 个中文释义。`};function startPractice(m){items=scopeWords();if(!items.length)return alert('当前范围没有单词');items=[...items].sort(()=>Math.random()-.5);idx=0;mode=m;$('practice').classList.add('show');$('ptitle').textContent=m==='spelling'?'✍️ 拼写练习':'🇨🇳 中文识词';$('pcat').textContent=selectedParent+' → '+(selectedChild==='__ALL__'?'全部':selectedChild);showPractice();$('practice').scrollIntoView({behavior:'smooth'})}function showPractice(){let x=items[idx];answered=false;$('pword').textContent=mode==='spelling'?'🔊 听发音并拼写':english(x);$('pinput').value='';$('pinput').disabled=false;$('pinput').placeholder=mode==='spelling'?'请输入你听到的单词':'请输入这个单词的中文意思';$('presult').textContent='';$('pprogress').textContent=`第 ${idx+1} / ${items.length} 题`;setTimeout(()=>speak(english(x)),100)}function norm(s){return String(s).toLowerCase().replace(/[\s，。！？、,.!?；;：“”‘’'"()（）【】\[\]{}]/g,'')}function submitPractice(){if(answered)return;let a=$('pinput').value.trim(),x=items[idx];if(!a)return;answered=true;$('pinput').disabled=true;if(mode==='spelling'){if(a.toLowerCase()===english(x).toLowerCase())$('presult').textContent='🎉 正确！';else{$('presult').innerHTML=`❌ 正确答案：<b>${esc(english(x))}</b>`;if(!wrong.some(w=>w.word.toLowerCase()===english(x).toLowerCase()))wrong.push({word:english(x),parent:x.parent,category:x.category});save();renderWrong()}}else{$('presult').innerHTML=x._zh&&norm(a)===norm(x._zh)?'🎉 正确！':`💡 参考答案：<b>${esc(x._zh||'暂无中文释义')}</b>`}}function renderWrong(){let box=$('wrongList');if(!wrong.length){box.className='empty';box.textContent='暂时没有错题。';return}box.className='';box.innerHTML=wrong.map((x,i)=>`<div class="word"><div><b>${esc(x.word)}</b><div class="small">📁 ${esc(x.parent||'')} · ${esc(x.category||'')}</div></div><div class="actions"><button class="play" data-wplay="${esc(x.word)}">🔊</button><button class="soft" data-wdel="${i}">移除</button></div></div>`).join('');document.querySelectorAll('[data-wplay]').forEach(b=>b.onclick=()=>speak(b.dataset.wplay));document.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{wrong.splice(+b.dataset.wdel,1);save();renderWrong()})}function nextPractice(){if(idx<items.length-1){idx++;showPractice()}else{$('presult').textContent='🎉 本次练习完成！';$('pprogress').textContent=`共完成 ${items.length} 题`;$('pinput').disabled=true}}function render() {renderCats();renderList();renderWrong()}$('spell').onclick=()=>startPractice('spelling');$('meaningPractice').onclick=()=>startPractice('meaning');$('pplay').onclick=()=>items[idx]&&speak(english(items[idx]));$('prepeat').onclick=()=>items[idx]&&speak(english(items[idx]));$('psubmit').onclick=submitPractice;$('pnext').onclick=nextPractice;$('pexit').onclick=()=>$('practice').classList.remove('show');$('pinput').addEventListener('keydown',e=>{if(e.key==='Enter')submitPractice()});save();render();</script></body></html>
