<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My English Words</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:960px;margin:auto;padding:36px 18px 60px}.hero{margin-bottom:24px}h1{font-size:34px;margin:0 0 8px}.sub{color:#6b7280}.card{background:#fff;border:1px solid #e8eaf0;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 25px #00000008}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}textarea{width:100%;min-height:150px;border:1px solid #d8dce5;border-radius:12px;padding:14px;font-size:16px;resize:vertical}button,select,input{border:0;border-radius:10px;padding:10px 14px;font-size:15px}button{cursor:pointer}.primary{background:#6d4aff;color:#fff}.soft{background:#eef0f5;color:#333}select,input{border:1px solid #d8dce5;background:#fff}.category-title{font-size:16px;font-weight:700;margin-bottom:10px}.categories{display:flex;gap:8px;flex-wrap:wrap}.cat{background:#eef0f5;color:#444}.cat.active{background:#6d4aff;color:#fff}.cat .num{opacity:.7;font-size:12px;margin-left:4px}.manage{margin-top:14px;padding-top:14px;border-top:1px solid #eee}.manage-row{display:flex;gap:8px;flex-wrap:wrap}.manage-row input{flex:1;min-width:160px}.cat-manage{display:flex;flex-direction:column;gap:8px;margin-top:10px}.cat-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:#f7f8fb;border-radius:10px}.cat-name{flex:1}.word{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid #eee}.word:last-child{border-bottom:0}.term{font-size:22px;font-weight:700}.ipa{color:#6d4aff;margin-left:8px}.meaning{color:#6b7280;margin-top:5px;font-size:14px}.tag{display:inline-block;background:#f0ebff;color:#5b36e8;border-radius:8px;padding:3px 7px;font-size:12px;margin-top:7px}.actions{display:flex;gap:7px;align-items:center}.play{width:44px;height:44px;border-radius:50%;background:#eee8ff;color:#5b36e8;font-size:19px;padding:0}.small{font-size:13px;color:#8a8f9c}.empty{text-align:center;color:#999;padding:30px}@media(max-width:600px){h1{font-size:28px}.word{align-items:flex-start}.actions{flex-shrink:0}.term{font-size:19px}}
</style>
</head>
<body><div class="wrap"><div class="hero"><h1>📚 My English Words</h1><div class="sub">把想学的单词分类保存，直接听标准发音。</div></div>
<div class="card"><div class="category-title">📂 单词分类</div><div id="categories" class="categories"></div><div class="manage"><div class="category-title">⚙️ 管理分类</div><div class="manage-row"><input id="newCategory" placeholder="输入新的分类名称"><button class="primary" id="addCategory">＋ 新建分类</button></div><div id="categoryManage" class="cat-manage"></div></div></div>
<div class="card"><textarea id="input" placeholder="例如：\nembark\nexclude\ndevastating\ntorrents\ndebris"></textarea><div class="row"><select id="addCategorySelect"></select><button class="primary" id="add">＋ 添加单词</button><button class="soft" id="clear">清空</button><span class="small" id="count"></span></div></div>
<div class="card"><div class="row" style="margin-top:0"><strong>🔊 发音</strong><select id="accent"><option value="us">🇺🇸 美式</option><option value="uk">🇬🇧 英式</option></select><button class="soft" id="playAll">▶️ 播放全部</button><span class="small" id="status"></span></div></div>
<div class="card"><div id="list" class="empty">还没有单词。</div></div></div>
<script>
const KEY="myEnglishWordsV2",CATKEY="myEnglishCategoriesV1";
const defaultCategories=["日常生活","商务外贸","汽车汽配","旅行","口语表达","其他"];
let categories=JSON.parse(localStorage.getItem(CATKEY)||"null")||defaultCategories.slice();
let rawWords=JSON.parse(localStorage.getItem(KEY)||"[]");
let words=rawWords.map(x=>typeof x==='string'?{word:x,category:"其他"}:x);
words.forEach(x=>{if(!x.category||!categories.includes(x.category))x.category="其他"});
if(!categories.includes("其他"))categories.push("其他");
let selectedCategory="全部";const audioCache=new Map();
function save(){localStorage.setItem(KEY,JSON.stringify(words));localStorage.setItem(CATKEY,JSON.stringify(categories))}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function countCat(c){return words.filter(x=>x.category===c).length}
function renderCategories(){
 const box=document.getElementById("categories");
 const all=["全部",...categories];
 box.innerHTML=all.map(c=>`<button class="cat ${selectedCategory===c?'active':''}" data-cat="${esc(c)}">${esc(c)}<span class="num">${c==='全部'?words.length:countCat(c)}</span></button>`).join('');
 box.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{selectedCategory=b.dataset.cat;render()});
 const sel=document.getElementById("addCategorySelect");sel.innerHTML=categories.map(c=>`<option value="${esc(c)}">📂 ${esc(c)}</option>`).join('');
 if(!categories.includes(sel.value))sel.value=categories[0];
 const cm=document.getElementById("categoryManage");
 cm.innerHTML=categories.map((c,i)=>`<div class="cat-item"><span class="cat-name">📁 ${esc(c)} <span class="small">(${countCat(c)} 个)</span></span><button class="soft" data-rename="${i}">重命名</button>${c!=="其他"?`<button class="soft" data-deletecat="${i}">删除</button>`:""}</div>`).join('');
 cm.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>renameCategory(Number(b.dataset.rename)));
 cm.querySelectorAll('[data-deletecat]').forEach(b=>b.onclick=()=>deleteCategory(Number(b.dataset.deletecat)));
}
function renameCategory(i){const old=categories[i],name=prompt("请输入新的分类名称：",old);if(!name||!name.trim()||name.trim()===old)return;const n=name.trim();if(categories.includes(n)){alert("这个分类已经存在。");return}categories[i]=n;words.forEach(x=>{if(x.category===old)x.category=n});if(selectedCategory===old)selectedCategory=n;save();render()}
function deleteCategory(i){const c=categories[i];if(c==='其他')return;if(!confirm(`删除“${c}”后，该分类的单词会移动到“其他”。确定吗？`))return;words.forEach(x=>{if(x.category===c)x.category='其他'});categories.splice(i,1);if(selectedCategory===c)selectedCategory='全部';save();render()}
document.getElementById("addCategory").onclick=()=>{const input=document.getElementById("newCategory"),name=input.value.trim();if(!name)return;if(categories.includes(name)){alert("这个分类已经存在。");return}categories.splice(categories.length-1,0,name);input.value="";save();renderCategories()};
document.getElementById("add").onclick=()=>{const input=document.getElementById("input"),cat=document.getElementById("addCategorySelect").value,incoming=input.value.split(/[\s,，、;；]+/).map(x=>x.trim()).filter(Boolean),seen=new Set(words.map(x=>x.word.toLowerCase()));for(const w of incoming)if(!seen.has(w.toLowerCase())){words.push({word:w,category:cat});seen.add(w.toLowerCase())}input.value="";save();render()};
document.getElementById("clear").onclick=()=>{if(confirm("确定清空当前分类里的单词吗？")){if(selectedCategory==='全部')words=[];else words=words.filter(x=>x.category!==selectedCategory);audioCache.clear();save();render()}};
function systemSpeak(word){return new Promise(resolve=>{if(!('speechSynthesis'in window)){resolve(false);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang=document.getElementById("accent").value==='uk'?'en-GB':'en-US';u.rate=.82;u.pitch=1;const voices=speechSynthesis.getVoices(),wanted=u.lang,voice=voices.find(v=>v.lang===wanted)||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(wanted.slice(0,2).toLowerCase()));if(voice)u.voice=voice;u.onend=()=>resolve(true);u.onerror=()=>resolve(false);speechSynthesis.speak(u)})}
async function play(word){const status=document.getElementById("status"),url=audioCache.get(word.toLowerCase());if(url){status.textContent="正在播放…";try{const a=new Audio(url);a.preload="auto";a.volume=1;await a.play();a.onended=()=>status.textContent="";return}catch(e){}}status.textContent="使用系统英语发音…";const ok=await systemSpeak(word);status.textContent=ok?"":"发音失败，请检查浏览器声音设置。"}
document.getElementById("playAll").onclick=async()=>{const list=words.filter(x=>selectedCategory==='全部'||x.category===selectedCategory);for(const x of list){await play(x.word);await new Promise(r=>setTimeout(r,450))}};
function render(){renderCategories();const list=document.getElementById("list"),shown=words.filter(x=>selectedCategory==='全部'||x.category===selectedCategory);document.getElementById("count").textContent=shown.length?`当前 ${shown.length} 个`:"";if(!shown.length){list.className="empty";list.textContent="这个分类还没有单词。";return}list.className="";list.innerHTML=shown.map((x,i)=>`<div class="word"><div><div><span class="term">${esc(x.word)}</span><span class="ipa" id="ipa${i}">/…/</span></div><div class="meaning" id="mean${i}">正在查询释义…</div><span class="tag">📂 ${esc(x.category)}</span></div><div class="actions"><button class="play" data-play="${esc(x.word)}">🔊</button><button class="soft" data-del="${esc(x.word)}">删除</button></div></div>`).join('');list.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>play(b.dataset.play));list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const w=b.dataset.del;const idx=words.findIndex(x=>x.word===w&&x.category===selectedCategory);if(idx>=0){words.splice(idx,1);save();render()}});shown.forEach((x,i)=>lookup(x.word,i))}
async function lookup(word,i){try{const r=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(word));if(!r.ok)throw 0;const d=await r.json(),item=d[0];let ipa=item.phonetic||"",audio="";for(const p of item.phonetics||[]){if(!ipa&&p.text)ipa=p.text;if(p.audio&&!audio)audio=p.audio}if(audio.startsWith("//"))audio="https:"+audio;if(audio)audioCache.set(word.toLowerCase(),audio);let meaning="";for(const m of item.meanings||[])if(m.definitions?.[0]){meaning=m.definitions[0].definition;break}const ip=document.getElementById("ipa"+i),me=document.getElementById("mean"+i);if(ip)ip.textContent=ipa||"暂无音标";if(me)me.textContent=meaning||"暂无释义"}catch{const ip=document.getElementById("ipa"+i),me=document.getElementById("mean"+i);if(ip)ip.textContent="暂无音标";if(me)me.textContent="暂无释义"}}
if('speechSynthesis'in window){speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}
save();render();
</script></body></html>
