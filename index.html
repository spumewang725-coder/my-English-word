<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My English Words</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:30px 18px 60px}h1{margin:0 0 6px}.sub,.small{color:#6b7280;font-size:13px}.card{background:#fff;border:1px solid #e8eaf0;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #00000008}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:10px}textarea{width:100%;min-height:130px;border:1px solid #d8dce5;border-radius:12px;padding:14px;font-size:16px}button,input,select{border-radius:10px;padding:10px 13px;font-size:15px;border:1px solid #d8dce5;background:#fff}button{cursor:pointer}.primary{background:#6d4aff;color:#fff;border-color:#6d4aff}.soft{background:#eef0f5;border-color:#eef0f5}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tab{background:#eef0f5;border-color:#eef0f5}.tab.active{background:#6d4aff;color:#fff}.subtabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;padding:10px;background:#f8f8fb;border-radius:12px}.subtab{font-size:14px;padding:8px 11px}.subtab.active{background:#e8e0ff;color:#5732db;border-color:#e8e0ff}.count{font-size:12px;opacity:.7}.word{display:flex;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid #eee}.word:last-child{border:0}.term{font-size:21px;font-weight:700}.meaning{color:#6b7280;margin-top:4px}.tag{display:inline-block;background:#f0ebff;color:#5b36e8;border-radius:8px;padding:3px 7px;font-size:12px;margin-top:6px}.actions{display:flex;gap:6px;align-items:center}.play{border:0;border-radius:50%;width:42px;height:42px}.empty{text-align:center;color:#999;padding:25px}.practice{display:none}.practice.show{display:block}.practice-word{font-size:30px;font-weight:700;text-align:center;padding:25px}.result{text-align:center;min-height:28px;margin:10px}.wrong{margin-top:15px;padding:12px;background:#fff7f7;border-radius:12px}.manage{margin-top:15px;padding-top:15px;border-top:1px solid #eee}.manage-row{display:flex;gap:8px;flex-wrap:wrap}.manage-row input{flex:1;min-width:180px}.section{margin-top:14px;padding-top:14px;border-top:1px solid #eee}.manage-parent{padding:10px 0}.parent-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}.child-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;padding-left:8px}.child-item{display:flex;align-items:center;gap:4px;background:#f6f7fa;border-radius:9px;padding:5px 7px}.child-item button{padding:4px 7px;font-size:12px;border:0;background:transparent}.hint{background:#f8f7ff;padding:10px 12px;border-radius:10px;margin-top:10px;line-height:1.6}@media(max-width:600px){.word{align-items:flex-start}.term{font-size:18px}.actions{flex-wrap:wrap}.practice-word{font-size:25px}}</style></head><body><div class="wrap"><h1>📚 My English Words</h1><div class="sub">大分类 → 小分类 → 单词。练习可以精确到每一个小分类。</div>
<div id="practice" class="card practice"><div><b id="ptitle">✍️ 拼写练习</b> <span id="pcat" class="small"></span></div><div id="pword" class="practice-word">🔊 听发音并拼写</div><div class="row"><button class="primary" id="pplay">🔊 播放</button><button class="soft" id="prepeat">再听一次</button></div><input id="pinput" style="width:100%;font-size:19px;text-align:center" placeholder="请输入答案"><div id="presult" class="result"></div><div class="row"><button class="primary" id="psubmit">提交答案</button><button class="soft" id="pnext">下一题 →</button><button class="soft" id="pexit">退出</button></div><div id="pprogress" class="small" style="text-align:center"></div><div class="wrong"><b id="sessionTitle">🔴 本次错题</b><div id="sessionWrong"></div></div></div>
<div class="card"><b>📂 单词分类</b><div id="parents" class="tabs"></div><div id="children" class="subtabs"></div><div class="small" style="margin-top:8px">当前练习范围：<b id="scope">全部</b></div><div class="manage"><b>⚙️ 管理分类</b><div class="section" style="margin-top:8px;padding-top:0;border:0"><div class="manage-row"><input id="newParent" placeholder="新建大分类"><button class="primary" id="addParent">＋ 大分类</button></div></div><div class="section"><div class="manage-row"><input id="newChild" placeholder="例如：水果蔬菜"><button class="primary" id="addChild">＋ 小分类</button></div><div class="small" style="margin-top:6px">先选中一个大分类，再添加它的小分类。</div></div><div class="section"><b>编辑分类名称</b><div id="manageList"></div></div></div></div>
<div class="card"><textarea id="input" placeholder="一行一个词条：\nkiwi fruit 猕猴桃\ncredit card 信用卡\ntake a break 休息一下"></textarea><div class="row"><select id="parentSelect"></select><select id="childSelect"></select><button class="primary" id="add">＋ 添加单词</button><button class="soft" id="clear">清空当前范围</button></div><div class="small" style="margin-top:8px">格式：英文词/词组 + 空格 + 中文释义。英文词组不会被拆开。</div></div>
<div class="card"><div class="row" style="margin-top:0"><b>🔊 发音</b><select id="accent"><option value="us">🇺🇸 美式</option><option value="uk">🇬🇧 英式</option></select><button class="soft" id="playAll">▶️ 播放当前范围</button><button class="primary" id="spell">✍️ 拼写练习</button><button class="primary" id="meaningPractice">🇨🇳 中文识词</button><button class="soft" id="repair">🛠️ 修复词库</button></div><div id="repairMsg" class="small" style="margin-top:8px"></div></div>
<div class="card"><div id="list" class="empty">还没有单词。</div></div><div class="card"><b>🔴 错题复习</b><div id="wrongList" class="empty">暂时没有错题。</div></div></div>
<script>
const KEY='myEnglishWordsV2',CATKEY='myEnglishCategoriesV1',WRONGKEY='myEnglishWrongV1';
const defaults=['日常生活','商务外贸','汽车汽配','旅行','口语表达','其他'];
const defaultChildren={'日常生活':['水果蔬菜','海鲜','职业','家庭','购物','交通','身体健康','天气'],'商务外贸':['邮件表达','报价付款','订单交期','客户沟通'],'汽车汽配':['发动机','底盘悬挂','制动系统','空调系统','电气系统'],'旅行':['机场交通','酒店住宿','餐厅点餐','旅游景点'],'口语表达':['日常交流','社交表达','情绪感受'],'其他':['未分类']};
let categories=JSON.parse(localStorage.getItem(CATKEY)||'null');let raw=JSON.parse(localStorage.getItem(KEY)||'[]');let words=raw.map(x=>typeof x==='string'?{word:x,parent:'其他',category:'未分类'}:x);let wrong=JSON.parse(localStorage.getItem(WRONGKEY)||'[]');
if(!Array.isArray(categories))categories=defaults.slice();let savedTree=JSON.parse(localStorage.getItem('myEnglishCategoryTreeV1')||'null');let tree={};categories.forEach(c=>tree[c]=(savedTree&&Array.isArray(savedTree[c]))?savedTree[c].slice():(defaultChildren[c]?defaultChildren[c].slice():['未分类']));if(!tree['其他'])tree['其他']=['未分类'];categories=Object.keys(tree);if(!categories.includes('其他')){categories.push('其他');tree['其他']=['未分类']}
words.forEach(x=>{if(!x.parent)x.parent=x.category&&categories.includes(x.category)?x.category:'其他';if(!categories.includes(x.parent))x.parent='其他';if(!x.category||!tree[x.parent]?.includes(x.category))x.category=tree[x.parent][0]||'未分类'});
let selectedParent='日常生活',selectedChild='__ALL__',items=[],idx=0,mode='spelling',answered=false,sessionWrong=[];if(!categories.includes(selectedParent))selectedParent=categories[0];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(words));localStorage.setItem(CATKEY,JSON.stringify(categories));localStorage.setItem(WRONGKEY,JSON.stringify(wrong));localStorage.setItem('myEnglishCategoryTreeV1',JSON.stringify(tree))}function english(x){return String(x.word||'').replace(/\s*[\u4e00-\u9fff].*$/,'').trim()||String(x.word||'').trim()}function parseLine(s){s=s.trim();let m=s.match(/^(.*?)\s+([\u4e00-\u9fff][\u4e00-\u9fff\s、，,。；;：:！!?？]*)$/);return m?{word:m[1].trim(),zh:m[2].trim()}:{word:s,zh:''}}function norm(s){return String(s).toLowerCase().replace(/[\s，。！？、,.!?；;：“”‘’'"()（）【】\[\]{}]/g,'')}
function scopeWords(){return words.filter(x=>x.parent===selectedParent&&(selectedChild==='__ALL__'||x.category===selectedChild))}
function renderCats(){$('parents').innerHTML=categories.map(c=>`<button class="tab ${selectedParent===c?'active':''}" data-parent="${esc(c)}">${esc(c)} <span class="count">${words.filter(x=>x.parent===c).length}</span></button>`).join('');document.querySelectorAll('[data-parent]').forEach(b=>b.onclick=()=>{selectedParent=b.dataset.parent;selectedChild='__ALL__';render()});let kids=tree[selectedParent]||[];$('children').innerHTML=`<button class="subtab ${selectedChild==='__ALL__'?'active':''}" data-child="__ALL__">全部 <span class="count">${words.filter(x=>x.parent===selectedParent).length}</span></button>`+kids.map(c=>`<button class="subtab ${selectedChild===c?'active':''}" data-child="${esc(c)}">${esc(c)} <span class="count">${words.filter(x=>x.parent===selectedParent&&x.category===c).length}</span></button>`).join('');document.querySelectorAll('[data-child]').forEach(b=>b.onclick=()=>{selectedChild=b.dataset.child;render()});$('scope').textContent=selectedChild==='__ALL__'?selectedParent+'（全部小分类）':selectedParent+' → '+selectedChild;$('parentSelect').innerHTML=categories.map(c=>`<option value="${esc(c)}">📁 ${esc(c)}</option>`).join('');$('parentSelect').value=selectedParent;fillChildSelect();$('manageList').innerHTML=categories.map((p,i)=>`<div class="manage-parent"><div class="parent-head"><span>📁 ${esc(p)} (${words.filter(x=>x.parent===p).length})</span><span><button class="soft" data-rp="${i}">重命名</button>${p!=='其他'?` <button class="soft" data-dp="${i}">删除</button>`:''}</span></div><div class="child-list">${(tree[p]||[]).map((c,j)=>`<span class="child-item">${esc(c)} <button data-rc="${i}:${j}">✏️</button>${c!=='未分类'||p!=='其他'?`<button data-dc="${i}:${j}">×</button>`:''}</span>`).join('')}</div></div>`).join('');document.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>renameParent(+b.dataset.rp));document.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>deleteParent(+b.dataset.dp));document.querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>renameChild(...b.dataset.rc.split(':').map(Number)));document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>deleteChild(...b.dataset.dc.split(':').map(Number)))}
function fillChildSelect(){let p=$('parentSelect').value,kids=tree[p]||[];$('childSelect').innerHTML=kids.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(p===selectedParent&&selectedChild!=='__ALL__'&&kids.includes(selectedChild))$('childSelect').value=selectedChild)}$('parentSelect').onchange=()=>{selectedParent=$('parentSelect').value;selectedChild='__ALL__';fillChildSelect();render()};
function renameParent(i){let old=categories[i],n=prompt('新的大分类名称：',old);if(!n||!n.trim()||categories.includes(n.trim()))return;n=n.trim();categories[i]=n;tree[n]=tree[old];delete tree[old];words.forEach(x=>{if(x.parent===old)x.parent=n});wrong.forEach(x=>{if(x.parent===old)x.parent=n});if(selectedParent===old)selectedParent=n;save();render()}function deleteParent(i){let p=categories[i];if(p==='其他'||!confirm(`删除“${p}”并把其中单词移动到“其他”？`))return;words.forEach(x=>{if(x.parent===p){x.parent='其他';x.category='未分类'}});delete tree[p];categories.splice(i,1);if(selectedParent===p)selectedParent='其他';selectedChild='__ALL__';save();render()}
$('addParent').onclick=()=>{let n=$('newParent').value.trim();if(!n||categories.includes(n))return;categories.splice(categories.length-1,0,n);tree[n]=['未分类'];$('newParent').value='';selectedParent=n;selectedChild='__ALL__';save();render()};$('addChild').onclick=()=>{let p=selectedParent,n=$('newChild').value.trim();if(!n)return;if((tree[p]||[]).includes(n))return;tree[p].push(n);$('newChild').value='';selectedChild=n;save();render()};function renameChild(pi,ci){let p=categories[pi],old=tree[p][ci],n=prompt('新的小分类名称：',old);if(!n||!n.trim()||tree[p].includes(n.trim()))return;n=n.trim();tree[p][ci]=n;words.forEach(x=>{if(x.parent===p&&x.category===old)x.category=n});wrong.forEach(x=>{if(x.parent===p&&x.category===old)x.category=n});if(selectedParent===p&&selectedChild===old)selectedChild=n;save();render()}function deleteChild(pi,ci){let p=categories[pi],c=tree[p][ci];if(tree[p].length<=1)return;if(!confirm(`删除小分类“${c}”，其中单词会移动到第一个小分类。`))return;let target=tree[p].find(x=>x!==c)||'未分类';words.forEach(x=>{if(x.parent===p&&x.category===c)x.category=target});tree[p].splice(ci,1);if(selectedParent===p&&selectedChild===c)selectedChild='__ALL__';save();render()}
$('add').onclick=()=>{let p=$('parentSelect').value,c=$('childSelect').value,seen=new Set(words.map(x=>english(x).toLowerCase()));$('input').value.split(/\n+/).map(parseLine).filter(x=>x.word).forEach(o=>{let k=o.word.toLowerCase();if(!seen.has(k)){words.push({word:o.word,parent:p,category:c,_zh:o.zh});seen.add(k)}else if(o.zh){let x=words.find(w=>english(w).toLowerCase()===k);if(x&&!x._zh)x._zh=o.zh}});$('input').value='';selectedParent=p;selectedChild=c;save();render()};$('clear').onclick=()=>{let arr=scopeWords();if(!arr.length)return;if(confirm(`确定清空“${selectedParent}${selectedChild==='__ALL__'?'':' → '+selectedChild}”里的单词吗？`)){let set=new Set(arr);words=words.filter(x=>!set.has(x));save();render()}};
function speak(w){return new Promise(r=>{if(!speechSynthesis)return r();speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang=$('accent').value==='uk'?'en-GB':'en-US';u.rate=.82;u.onend=r;u.onerror=r;speechSynthesis.speak(u)})}$('playAll').onclick=async()=>{for(let x of scopeWords()){await speak(english(x));await new Promise(r=>setTimeout(r,350))}};
function edit(i){let x=words[i],w=prompt('编辑英文单词/词组：',english(x));if(w===null||!w.trim())return;let z=prompt('编辑中文释义：',x._zh||'');if(z===null)return;x.word=w.trim();x._zh=z.trim();save();render()}function render(){renderCats();let shown=scopeWords();$('list').className=shown.length?'':'empty';$('list').innerHTML=shown.length?shown.map(x=>{let real=words.indexOf(x);return `<div class="word"><div><div class="term">${esc(english(x))}</div><div class="meaning">${esc(x._zh||'暂无中文释义')}</div><span class="tag">📁 ${esc(x.parent)} · ${esc(x.category)}</span></div><div class="actions"><button class="play" data-p="${esc(english(x))}">🔊</button><button class="soft" data-e="${real}">✏️ 编辑</button><button class="soft" data-x="${real}">删除</button></div></div>`}).join(''):'这个分类还没有单词';document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>speak(b.dataset.p));document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>edit(+b.dataset.e));document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{words.splice(+b.dataset.x,1);save();render()});renderWrong()}
async function translateDirect(text){try{let u='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='+encodeURIComponent(text),r=await fetch(u);if(r.ok){let d=await r.json(),zh=(d[0]||[]).map(x=>x[0]).join('').trim();if(zh)return zh}}catch(e){}try{let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|zh-CN');if(r.ok){let d=await r.json(),zh=d?.responseData?.translatedText?.trim();if(zh&&zh.toLowerCase()!==text.toLowerCase())return zh}}catch(e){}return ''}async function autoMeaning(x){if(x._zh)return false;let zh=await translateDirect(english(x));if(zh){x._zh=zh;return true}return false}$('repair').onclick=async()=>{let added=0,total=words.length;$('repairMsg').textContent=`正在修复 0/${total}…`;for(let i=0;i<words.length;i++){let x=words[i],p=parseLine(x.word);if(p.word!==x.word){x.word=p.word;if(p.zh&&!x._zh)x._zh=p.zh}if(await autoMeaning(x))added++;$('repairMsg').textContent=`正在修复 ${i+1}/${total}… 已补充 ${added} 个中文`}save();render();$('repairMsg').textContent=`✅ 修复完成：补充 ${added} 个中文释义。`};
function start(m){items=scopeWords();if(!items.length)return alert('当前小分类还没有单词');items=[...items].sort(()=>Math.random()-.5);idx=0;mode=m;sessionWrong=[];$('practice').classList.add('show');$('ptitle').textContent=m==='spelling'?'✍️ 拼写练习':'🇨🇳 中文识词';$('pcat').textContent=selectedParent+' → '+(selectedChild==='__ALL__'?'全部':selectedChild);showPractice();$('practice').scrollIntoView({behavior:'smooth'})}function showPractice(){let x=items[idx];answered=false;$('pword').textContent=mode==='spelling'?'🔊 听发音并拼写':english(x);$('pinput').value='';$('pinput').disabled=false;$('pinput').placeholder=mode==='spelling'?'请输入你听到的单词':'请输入这个单词的中文意思';$('presult').textContent='';$('pprogress').textContent=`第 ${idx+1} / ${items.length} 题`;renderSessionWrong();setTimeout(()=>speak(english(x)),100)}function submit(){if(answered)return;let a=$('pinput').value.trim(),x=items[idx];if(!a)return;answered=true;$('pinput').disabled=true;if(mode==='spelling'){if(a.toLowerCase()===english(x).toLowerCase())$('presult').textContent='🎉 Correct!';else{$('presult').innerHTML=`❌ 正确答案：<b>${esc(english(x))}</b>`;if(!wrong.some(w=>w.word.toLowerCase()===english(x).toLowerCase()))wrong.push({word:english(x),parent:x.parent,category:x.category});sessionWrong.push(x);save();renderWrong();renderSessionWrong()}}else{let z=x._zh||'';$('presult').innerHTML=z&&norm(a)===norm(z)?'🎉 正确！':`💡 参考中文：<b>${esc(z||'暂无中文释义')}</b>`}}function next(){if(idx<items.length-1){idx++;showPractice()}else{$('presult').textContent='🎉 本次练习完成！';$('pprogress').textContent=`共完成 ${items.length} 题`;$('pinput').disabled=true}}function renderSessionWrong(){let box=$('sessionWrong');if(mode==='meaning'){box.innerHTML='<div class="small">中文识词不会加入拼写错题本。👍</div>';return}box.innerHTML=sessionWrong.length?sessionWrong.map(x=>`<div class="wrong-item"><span>${esc(english(x))}</span><button class="soft" data-sw="${esc(english(x))}">🔊</button></div>`).join(''):'<div class="small">本次还没有错题 👍</div>';document.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>speak(b.dataset.sw))}function renderWrong(){let box=$('wrongList');if(!wrong.length){box.className='empty';box.textContent='暂时没有错题。';return}box.className='';box.innerHTML=wrong.map((x,i)=>`<div class="wrong-item"><div><b>${esc(x.word)}</b><div class="small">📁 ${esc(x.parent||'')} · ${esc(x.category||'')}</div></div><div class="actions"><button class="play" data-wp="${esc(x.word)}">🔊</button><button class="soft" data-wd="${i}">移除</button></div></div>`).join('');document.querySelectorAll('[data-wp]').forEach(b=>b.onclick=()=>speak(b.dataset.wp));document.querySelectorAll('[data-wd]').forEach(b=>b.onclick=()=>{wrong.splice(+b.dataset.wd,1);save();renderWrong()})}
$('spell').onclick=()=>start('spelling');$('meaningPractice').onclick=()=>start('meaning');$('pplay').onclick=()=>items[idx]&&speak(english(items[idx]));$('prepeat').onclick=()=>items[idx]&&speak(english(items[idx]));$('psubmit').onclick=submit;$('pnext').onclick=next;$('pexit').onclick=()=>$('practice').classList.remove('show');$('pinput').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});save();render();
</script></body></html>
