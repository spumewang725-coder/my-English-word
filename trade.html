<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外贸场景训练</title><style>body{font-family:system-ui;background:#f6f7fb;padding:20px}.card{background:#fff;padding:20px;border-radius:16px;max-width:800px;margin:auto}button,textarea,select{padding:10px;margin:5px;border-radius:8px}</style></head><body><div class="card"><h1>💼 外贸场景训练</h1><select id="scene"></select><button onclick="addScene()">+ 新建场景</button><button onclick="addSentence()">+ 添加句子</button><button onclick="practice()">开始10题练习</button><button onclick="reviewWrong()">❌ 错题复习</button><div id="box"></div></div><script>
let data=JSON.parse(localStorage.tradeData||JSON.stringify({报价:[{cn:'这是我们目前最有竞争力的价格。',en:'This is our most competitive price at the moment.'}],催付款:[{cn:'请尽快安排付款。',en:'Please arrange the payment as soon as possible.'}],催货:[],质量问题:[]}));let wrong=JSON.parse(localStorage.tradeWrong||'[]');let s=document.getElementById('scene'),box=document.getElementById('box'),queue=[],num=0;
function save(){localStorage.tradeData=JSON.stringify(data);localStorage.tradeWrong=JSON.stringify(wrong)}function load(){s.innerHTML=Object.keys(data).map(x=>`<option>${x}</option>`).join('');render()}function render(){box.innerHTML=(data[s.value]||[]).map((x,i)=>`<p>中文：${x.cn}<br>英文：${x.en}<br><button onclick="edit(${i})">编辑</button><button onclick="del(${i})">删除</button></p>`).join('')||'暂无句子'}function addScene(){let n=prompt('场景名称');if(n&&!data[n]){data[n]=[];save();load()}}function addSentence(){let c=prompt('中文');let e=prompt('英文');if(c&&e){data[s.value].push({cn:c,en:e});save();render()}}function edit(i){let x=data[s.value][i];x.cn=prompt('中文',x.cn);x.en=prompt('英文',x.en);save();render()}function del(i){data[s.value].splice(i,1);save();render()}function practice(){queue=[...data[s.value]].sort(()=>Math.random()-0.5).slice(0,10);num=0;next()}function next(){if(num>=queue.length){box.innerHTML='🎉 练习完成';return}let x=queue[num++];box.innerHTML=`<h3>第${num}题</h3><p>🇨🇳 ${x.cn}</p><textarea id="ans" placeholder="输入英文"></textarea><button onclick="show('${x.en.replace(/'/g,"\\'")}')">提交</button><p id="show"></p>`}function show(a){let item=queue[num-1];document.getElementById('show').innerHTML='参考答案：'+a+'<br><button onclick="addWrong()">加入错题</button><button onclick="next()">下一题</button>'}function addWrong(){let item=queue[num-1];if(!wrong.find(x=>x.cn===item.cn)){wrong.push(item);save();alert('已加入错题')}}function reviewWrong(){if(!wrong.length){box.innerHTML='暂无错题';return}queue=[...wrong];num=0;next()}s.onchange=render;load();</script></body></html>
